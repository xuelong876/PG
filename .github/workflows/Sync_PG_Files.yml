name: Sync PG Files

on:
  schedule:
    # 每月5号19点运行 (UTC时间，北京时间减8小时 → 11点UTC)
    - cron: '0 11 5 * *'
  workflow_dispatch: # 允许手动触发

permissions:
  contents: write   # 允许用 GITHUB_TOKEN 推送到当前仓库

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      # 1. 检出当前仓库（拿 sync_pg_json.py，并准备推送）
      - name: Checkout current repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2. 检查上游仓库最新 commit 时间
      - name: Get upstream repo latest commit time
        id: upstream_check
        run: |
          COMMIT_DATE=$(curl -s "https://api.github.com/repos/fish2018/PG/commits?per_page=1" \
            | jq -r '.[0].commit.committer.date')

          COMMIT_TIMESTAMP=$(date -d "$COMMIT_DATE" +%s)
          CURRENT_TIMESTAMP=$(date +%s)
          DAYS_DIFF=$(( (CURRENT_TIMESTAMP - COMMIT_TIMESTAMP) / 86400 ))

          echo "commit_date=$COMMIT_DATE" >> $GITHUB_OUTPUT
          echo "days_diff=$DAYS_DIFF" >> $GITHUB_OUTPUT
          echo "上游最新 commit: $COMMIT_DATE （距今 $DAYS_DIFF 天）"

      # 3. 超过 31 天直接退出
      - name: Exit if commit is older than 31 days
        if: ${{ steps.upstream_check.outputs.days_diff > 311}}
        run: |
          echo "上游仓库最新 commit 已超过 31 天，退出工作流"
          exit 0

      # 4. 浅克隆上游仓库到 /tmp（不污染工作区）
      - name: Clone upstream repo (shallow)
        if: ${{ steps.upstream_check.outputs.days_diff <= 321}}
        run: |
          rm -rf /tmp/upstream /tmp/extracted
          git clone --depth 1 https://github.com/fish2018/PG.git /tmp/upstream
          echo "克隆完成，仓库内容:"
          ls -la /tmp/upstream/

      # 5. 解压 zip 到 /tmp/extracted
      - name: Extract PG zip
        if: ${{ steps.upstream_check.outputs.days_diff <= 321}}
        run: |
          ZIP_FILE=$(find /tmp/upstream -maxdepth 1 -iname "pg*.zip" -type f | head -n 1)
          if [ -z "$ZIP_FILE" ]; then
            echo "未找到 pg*.zip 文件"
            exit 1
          fi
          echo "找到 zip: $ZIP_FILE"

          mkdir -p /tmp/extracted
          unzip -o "$ZIP_FILE" -d /tmp/extracted/
          echo "解压完成:"
          ls -la /tmp/extracted/

      # 6. 配置 Python
      - name: Setup Python
        if: ${{ steps.upstream_check.outputs.days_diff <= 321}}
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      # 7. 执行根目录的 sync_pg_json.py，输出明确指向仓库根目录
      - name: Run sync_pg_json.py
        if: ${{ steps.upstream_check.outputs.days_diff <= 321}}
        env:
          PG_OUTPUT: ${{ github.workspace }}/pg.json
        run: |
          if [ ! -f "sync_pg_json.py" ]; then
            echo "错误: 仓库根目录未找到 sync_pg_json.py"
            exit 1
          fi
          cp sync_pg_json.py /tmp/extracted/
          cd /tmp/extracted
          python sync_pg_json.py

          echo "检查输出:"
          ls -la "${{ github.workspace }}/pg.json" || true

      # 8. 把解压内容同步到仓库根目录（排除 .git）
      - name: Copy extracted files to repo root
        if: ${{ steps.upstream_check.outputs.days_diff <= 321}}
        run: |
          echo "复制解压内容到仓库根目录..."
          rsync -a --exclude='.git' /tmp/extracted/ ./
          echo "复制完成，仓库根目录:"
          ls -la

      # 9. 提交并推送到当前 GitHub 仓库
      - name: Push to GitHub (current repo)
        if: ${{ steps.upstream_check.outputs.days_diff <= 321}}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add -A
          if git diff --cached --quiet; then
            echo "无变更，跳过 GitHub 推送"
          else
            git commit -m "gunzip PG files from fish2018/PG - $(date +'%Y-%m-%d %H:%M:%S')"
            git push
          fi

      # 10. 把 pg.jar 推送到 Gitee 仓库
      - name: Push pg.jar to Gitee
       
        if: ${{ steps.upstream_check.outputs.days_diff <= 321 }}
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        run: |
          PG_JAR=$(find /tmp/extracted -name "pg.jar" -type f | head -n 1)
          if [ -z "$PG_JAR" ]; then
            echo "错误: 未找到 pg.jar"
            exit 1
          fi
      
          mkdir -p /tmp/gitee_push
          cp "$PG_JAR" /tmp/gitee_push/pg.jar
          cd /tmp/gitee_push
      
          git init
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
      
          # 用 master 作为本地分支名，和远端保持一致
          git checkout -b master
          git remote add origin https://xuelong88:${GITEE_TOKEN}@gitee.com/xuelong88/pg_box.git
      
          # 先拉远端，解决历史分叉
          git pull origin master --allow-unrelated-histories
      
          git add -A
          if git diff --cached --quiet; then
            echo "Gitee 无变更，跳过推送"
          else
            git commit -m "github Update pg.jar - $(date +'%Y-%m-%d %H:%M:%S')"
            git push origin master
          fi
          

      # 11. 执行总结
      - name: Summary
        if: always()
        run: |
          echo "上游最新 commit: ${{ steps.upstream_check.outputs.commit_date }}"
          echo "距今: ${{ steps.upstream_check.outputs.days_diff }} 天"
          if [ "${{ steps.upstream_check.outputs.days_diff }}" -gt 31 ]; then
            echo "状态: 跳过（超 31 天）"
          else
            echo "状态: 已执行同步"
          fi
